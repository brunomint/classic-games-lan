<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ebebee">
  <title>{% block title %}Fliperama de Casa{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='28' height='17' rx='8' fill='%23cdcad4' stroke='%2334313d' stroke-width='1.5'/%3E%3Ccircle cx='21' cy='13' r='2' fill='%232d5bb4'/%3E%3Ccircle cx='25' cy='16.5' r='2' fill='%23c8323c'/%3E%3Ccircle cx='17' cy='16.5' r='2' fill='%232b8a4c'/%3E%3Ccircle cx='21' cy='20' r='2' fill='%23e2a91f'/%3E%3Cpath d='M9 12.5v8M5 16.5h8' stroke='%2334313d' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="preload" href="{{ url_for('static', filename='fonts/saira.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-jogador-nome="{{ jogador.nome if jogador else '' }}">
  {% block content %}{% endblock %}
  <script src="{{ url_for('static', filename='js/relogio.js') }}"></script>
  <script src="{{ url_for('static', filename='js/perfis-controle.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tela-cheia.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
