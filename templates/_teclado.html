{# Teclado numérico na tela (toque e controle). alvo = seletor do campo do PIN. #}
{% macro teclado(alvo, id="", ok="Entrar", escondido=False) %}
<div class="teclado" {% if id %}id="{{ id }}"{% endif %} data-alvo="{{ alvo }}" aria-label="Teclado do PIN" {% if escondido %}hidden{% endif %}>
  {% for n in [1, 2, 3, 4, 5, 6, 7, 8, 9] %}<button type="button" class="tecla" data-nav data-tecla="{{ n }}">{{ n }}</button>{% endfor %}
  <button type="button" class="tecla tecla-apagar" data-nav data-tecla="apagar" aria-label="Apagar">⌫</button>
  <button type="button" class="tecla" data-nav data-tecla="0">0</button>
  <button type="submit" class="tecla tecla-ok" data-nav aria-label="{{ ok }}">OK</button>
</div>
{% endmacro %}
