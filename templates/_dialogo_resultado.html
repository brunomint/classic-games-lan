<!-- Resultado da partida (placar manual) — usado com static/js/resultado.js -->
<dialog id="dialogo-resultado" class="dialogo">
  <form id="form-resultado">
    <h2>Resultado da partida</h2>
    <fieldset id="opcoes-vencedor" class="opcoes"></fieldset>
    <label class="campo">
      <span>Placar (opcional)</span>
      <input type="text" name="placar" maxlength="40" placeholder="ex.: 3 x 1" autocomplete="off">
    </label>
    <p class="erro-form" id="erro-resultado" hidden></p>
    <div class="acoes">
      <button type="button" class="botao botao-claro" data-botao="B" id="cancelar-resultado">Cancelar</button>
      <button type="submit" class="botao" data-botao="A">Salvar resultado</button>
    </div>
  </form>
</dialog>
